</defs><rect x="0" y="0" width="700" height="420" fill="#fdfcfb"/>
<text x="350.0" y="36" font-size="13" font-weight="bold" fill="#1a1714" text-anchor="middle">The Note-to-Source loop</text>
<path d="M 400.0,118 A 120,120 0 0 1 395.2627944162883,247.0" stroke="#1a1714" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M 415.2627944162883,287.0 A 120,120 0 0 1 284.7372055837117,287.0" stroke="#1a1714" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

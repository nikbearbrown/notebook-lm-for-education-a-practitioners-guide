<rect x="280.0" y="82.0" width="140" height="36" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/>
<text x="350.0" y="98" font-size="11" font-weight="bold" fill="#1a1714" text-anchor="middle">Generate in chat</text>
<text x="350.0" y="113" font-size="9" font-weight="normal" fill="#4a4540" text-anchor="middle" font-style="italic">the response surfaces a synthesis</text>
<rect x="375.2627944162883" y="247.0" width="140" height="36" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/>
<text x="445.2627944162883" y="263.0" font-size="11" font-weight="bold" fill="#1a1714" text-anchor="middle">Pin as Note</text>
<text x="445.2627944162883" y="278.0" font-size="9" font-weight="normal" fill="#4a4540" text-anchor="middle" font-style="italic">the response is preserved as a sticky</text>
<rect x="184.73720558371173" y="247.0" width="140" height="36" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/>
<text x="254.73720558371173" y="263.0" font-size="11" font-weight="bold" fill="#1a1714" text-anchor="middle">Promote to Source</text>
<text x="254.73720558371173" y="278.0" font-size="9" font-weight="normal" fill="#4a4540" text-anchor="middle" font-style="italic">the Note is added to the source set</text>
<text x="154.73720558371173" y="305.0" font-size="10" font-weight="normal" fill="#1a1714" text-anchor="start" font-style="italic">← teacher's pedagogical</text>
<text x="154.73720558371173" y="319.0" font-size="10" font-weight="normal" fill="#1a1714" text-anchor="start" font-style="italic">    framing enters here</text>
<text x="350.0" y="388" font-size="11" font-weight="normal" fill="#4a4540" text-anchor="middle" font-style="italic">Subsequent outputs are grounded in the teacher's framing as well as the original sources.</text>

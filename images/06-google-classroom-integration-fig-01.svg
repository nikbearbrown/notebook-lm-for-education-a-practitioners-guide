</defs><rect x="0" y="0" width="700" height="420" fill="#fdfcfb"/>
<text x="350.0" y="36" font-size="13" font-weight="bold" fill="#1a1714" text-anchor="middle">Effective admin request: name the OU and the toggles</text>
<rect x="80" y="70" width="540" height="280" fill="#fdfcfb" stroke="#1a1714" stroke-width="1"/>
<line x1="80" y1="120" x2="620" y2="120" stroke="#1a1714" stroke-width="0.75"/>
<text x="96" y="92" font-size="11" font-weight="bold" fill="#1a1714" text-anchor="start">To:</text>
<text x="140" y="92" font-size="11" font-weight="normal" fill="#1a1714" text-anchor="start">it-admin@district.edu</text>
<text x="96" y="110" font-size="11" font-weight="bold" fill="#1a1714" text-anchor="start">Subject:</text>
<text x="160" y="110" font-size="11" font-weight="normal" fill="#1a1714" text-anchor="start">Enable NotebookLM for grade-9 OU</text>
<text x="96" y="140" font-size="10" font-weight="normal" fill="#1a1714" text-anchor="start">Hi,</text>
<text x="96" y="154" font-size="10" font-weight="normal" fill="#1a1714" text-anchor="start"></text>
<text x="96" y="168" font-size="10" font-weight="normal" fill="#1a1714" text-anchor="start">I'm planning a lesson on March 18 using NotebookLM with my</text>
<text x="96" y="182" font-size="10" font-weight="normal" fill="#1a1714" text-anchor="start">9th-grade biology class. The icon doesn't appear in my test</text>
<text x="96" y="196" font-size="10" font-weight="normal" fill="#1a1714" text-anchor="start">student account.</text>
<text x="96" y="210" font-size="10" font-weight="normal" fill="#1a1714" text-anchor="start"></text>
<text x="96" y="224" font-size="10" font-weight="normal" fill="#1a1714" text-anchor="start">Could you enable the following for the **grade-9 OU**?</text>
<text x="96" y="238" font-size="10" font-weight="normal" fill="#1a1714" text-anchor="start"></text>
<text x="96" y="252" font-size="10" font-weight="normal" fill="#1a1714" text-anchor="start">  •  Gemini</text>
<text x="96" y="266" font-size="10" font-weight="normal" fill="#1a1714" text-anchor="start">  •  NotebookLM</text>
<text x="96" y="280" font-size="10" font-weight="normal" fill="#1a1714" text-anchor="start">  •  Gemini in Classroom</text>
<text x="96" y="294" font-size="10" font-weight="normal" fill="#1a1714" text-anchor="start"></text>
<text x="96" y="308" font-size="10" font-weight="normal" fill="#1a1714" text-anchor="start">Happy to verify after — let me know when it's done.</text>
<text x="96" y="322" font-size="10" font-weight="normal" fill="#1a1714" text-anchor="start"></text>
<text x="96" y="336" font-size="10" font-weight="normal" fill="#1a1714" text-anchor="start">Thanks,</text>
<text x="96" y="350" font-size="10" font-weight="normal" fill="#1a1714" text-anchor="start">[Teacher name]</text>
<line x1="360" y1="228" x2="560" y2="228" stroke="#4a4540" stroke-width="0.75" stroke-dasharray="3 2"/>
<text x="565" y="232" font-size="10" font-weight="normal" fill="#4a4540" text-anchor="start" font-style="italic">← name the OU</text>
<line x1="260" y1="284" x2="560" y2="284" stroke="#4a4540" stroke-width="0.75" stroke-dasharray="3 2"/>
<text x="565" y="274" font-size="10" font-weight="normal" fill="#4a4540" text-anchor="start" font-style="italic">← name the</text>
<text x="565" y="288" font-size="10" font-weight="normal" fill="#4a4540" text-anchor="start" font-style="italic">  specific toggles</text>
<text x="350.0" y="388" font-size="11" font-weight="normal" fill="#4a4540" text-anchor="middle" font-style="italic">Specificity resolves in one round. "It doesn't work" takes three.</text>

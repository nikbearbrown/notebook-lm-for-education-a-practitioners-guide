<svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif"><defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#1a1714"/>
  </marker>
  <marker id="arrowL" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
    <polygon points="8 0, 0 3, 8 6" fill="#1a1714"/>
  </marker>
</defs><rect x="0" y="0" width="700" height="480" fill="#fdfcfb"/>
<text x="350.0" y="36" font-size="13" font-weight="bold" fill="#1a1714" text-anchor="middle">The four-question framework</text>
<rect x="280" y="70" width="140" height="40" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/>
<text x="350" y="87" font-size="11" font-weight="bold" fill="#1a1714" text-anchor="middle">Q1 — Learning goal?</text>
<text x="350" y="102" font-size="9" font-weight="normal" fill="#4a4540" text-anchor="middle" font-style="italic">(state as a verb)</text>
<line x1="350" y1="110" x2="350" y2="140" stroke="#1a1714" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="255" y="140" width="190" height="45" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/>
<text x="350" y="158" font-size="11" font-weight="bold" fill="#1a1714" text-anchor="middle">Q2 — Source set defined</text>
<text x="350" y="173" font-size="11" font-weight="bold" fill="#1a1714" text-anchor="middle">and uploadable?</text>
<line x1="255" y1="168" x2="180" y2="230" stroke="#1a1714" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="190" y="200" font-size="10" font-weight="normal" fill="#4a4540" text-anchor="start" font-style="italic">No →</text>
<rect x="110" y="230" width="140" height="38" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/>
<text x="180" y="247" font-size="11" font-weight="bold" fill="#1a1714" text-anchor="middle">Open-loop tool</text>
<text x="180" y="262" font-size="9" font-weight="normal" fill="#4a4540" text-anchor="middle" font-style="italic">(ChatGPT, Copilot, Perplexity)</text>
<line x1="445" y1="168" x2="520" y2="200" stroke="#1a1714" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="490" y="188" font-size="10" font-weight="normal" fill="#4a4540" text-anchor="start" font-style="italic">Yes ↓</text>
<rect x="420" y="200" width="200" height="45" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/>
<text x="520" y="218" font-size="11" font-weight="bold" fill="#1a1714" text-anchor="middle">Q3 — Citation required?</text>
<text x="520" y="233" font-size="9" font-weight="normal" fill="#4a4540" text-anchor="middle" font-style="italic">(audit trail to sources)</text>
<line x1="520" y1="245" x2="520" y2="275" stroke="#1a1714" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="530" y="264" font-size="10" font-weight="normal" fill="#4a4540" text-anchor="start" font-style="italic">Yes ↓</text>
<rect x="420" y="275" width="200" height="45" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/>
<text x="520" y="292" font-size="11" font-weight="bold" fill="#1a1714" text-anchor="middle">Q4 — Privacy constraint?</text>
<text x="520" y="307" font-size="9" font-weight="normal" fill="#4a4540" text-anchor="middle" font-style="italic">(student/regulated data)</text>
<line x1="520" y1="320" x2="520" y2="350" stroke="#1a1714" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="420" y="350" width="200" height="60" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/>
<text x="520" y="372" font-size="12" font-weight="bold" fill="#1a1714" text-anchor="middle">NotebookLM</text>
<text x="520" y="390" font-size="10" font-weight="normal" fill="#4a4540" text-anchor="middle" font-style="italic">(Workspace for Education)</text>
<text x="350.0" y="450" font-size="11" font-weight="normal" fill="#4a4540" text-anchor="middle" font-style="italic">Each question narrows the candidates. By Q4 the choice is usually one or two tools.</text>
</svg>
<svg viewBox="0 0 700 360" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif"><defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#1a1714"/>
  </marker>
  <marker id="arrowL" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
    <polygon points="8 0, 0 3, 8 6" fill="#1a1714"/>
  </marker>
</defs><rect x="0" y="0" width="700" height="360" fill="#fdfcfb"/>
<text x="350.0" y="36" font-size="13" font-weight="bold" fill="#1a1714" text-anchor="middle">The RAG pipeline, three steps</text>
<rect x="32.0" y="100" width="180" height="100" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/>
<text x="122.0" y="122" font-size="12" font-weight="bold" fill="#1a1714" text-anchor="middle">Step 1 — Retrieve</text>
<text x="122.0" y="148" font-size="10" font-weight="normal" fill="#4a4540" text-anchor="middle">user question →</text>
<text x="122.0" y="164" font-size="10" font-weight="normal" fill="#4a4540" text-anchor="middle">search uploaded</text>
<text x="122.0" y="180" font-size="10" font-weight="normal" fill="#4a4540" text-anchor="middle">documents</text>
<line x1="214.0" y1="150.0" x2="256.0" y2="150.0" stroke="#1a1714" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="260.0" y="100" width="180" height="100" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/>
<text x="350.0" y="122" font-size="12" font-weight="bold" fill="#1a1714" text-anchor="middle">Step 2 — Augment</text>
<text x="350.0" y="148" font-size="10" font-weight="normal" fill="#4a4540" text-anchor="middle">top-matched passages</text>
<text x="350.0" y="164" font-size="10" font-weight="normal" fill="#4a4540" text-anchor="middle">+ original question →</text>
<text x="350.0" y="180" font-size="10" font-weight="normal" fill="#4a4540" text-anchor="middle">language model</text>
<line x1="442.0" y1="150.0" x2="484.0" y2="150.0" stroke="#1a1714" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="488.0" y="100" width="180" height="100" fill="#f5f2ee" stroke="#1a1714" stroke-width="1"/>
<text x="578.0" y="122" font-size="12" font-weight="bold" fill="#1a1714" text-anchor="middle">Step 3 — Generate</text>
<text x="578.0" y="148" font-size="10" font-weight="normal" fill="#4a4540" text-anchor="middle">model produces response</text>
<text x="578.0" y="164" font-size="10" font-weight="normal" fill="#4a4540" text-anchor="middle">with citation markers →</text>
<text x="578.0" y="180" font-size="10" font-weight="normal" fill="#4a4540" text-anchor="middle">links back to sources</text>
<text x="350.0" y="280" font-size="11" font-weight="normal" fill="#4a4540" text-anchor="middle" font-style="italic">Every response carries inline citations linking each claim back to its source passage.</text>
<text x="350.0" y="297" font-size="11" font-weight="normal" fill="#4a4540" text-anchor="middle" font-style="italic">Click the citation; the source pane jumps to the passage that produced the claim.</text>
</svg>